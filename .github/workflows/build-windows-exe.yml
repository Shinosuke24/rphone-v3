name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build bundled Java runtime
        shell: pwsh
        run: |
          Write-Host "Skipping jlink runtime for now - will use system Java"
          # TODO: Implement proper jlink runtime creation in future iterations

      - name: Build desktop EXE
        shell: pwsh
        run: .\gradlew.bat :desktop:clean :desktop:createExe :desktop:installDist

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse -Force desktop\build\launch4j out\launch4j

      - name: Create Windows zip package
        shell: pwsh
        run: |
          $zipPath = "out\rphone-v3-windows-package.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path out\launch4j\* -DestinationPath $zipPath

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: rphone-v3-windows-package
          path: out\rphone-v3-windows-package.zip
          if-no-files-found: error
