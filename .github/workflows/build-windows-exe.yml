name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build bundled Java runtime
        shell: pwsh
        run: |
          $runtimeDir = "desktop\build\java-runtime"
          # Clean up any existing runtime directory
          if (Test-Path $runtimeDir) {
            Remove-Item -Recurse -Force $runtimeDir
          }
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --output $runtimeDir
          Write-Host "Java runtime bundled successfully at $runtimeDir"

      - name: Build desktop EXE
        shell: pwsh
        run: .\gradlew.bat :desktop:clean :desktop:createExe :desktop:installDist

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse -Force desktop\build\launch4j out\launch4j
          Copy-Item -Recurse -Force desktop\build\java-runtime out\jre
          Write-Host "Artifact prepared: EXE + bundled Java runtime"

      - name: Create Windows zip package
        shell: pwsh
        run: |
          $zipPath = "out\rphone-v3-windows-package.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          # Include both EXE and bundled JRE at root level of zip
          Compress-Archive -Path out\launch4j\rphone-v3-desktop.exe, out\jre -DestinationPath $zipPath

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: rphone-v3-windows-package
          path: out\rphone-v3-windows-package.zip
          if-no-files-found: error
