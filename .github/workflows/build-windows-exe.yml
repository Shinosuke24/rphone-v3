name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build desktop EXE
        shell: pwsh
        run: .\gradlew.bat :desktop:clean :desktop:createExe :desktop:installDist

      - name: Build bundled Java runtime
        shell: pwsh
        run: |
          $runtimeDir = "desktop\build\java-runtime"

          # Ensure output dir does NOT exist; jlink requires this
          if (Test-Path $runtimeDir) {
            Remove-Item -Recurse -Force $runtimeDir
          }

          # Only create parent directory; let jlink create the final output directory
          New-Item -ItemType Directory -Force -Path (Split-Path $runtimeDir -Parent) | Out-Null

          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,java.instrument,java.prefs,java.net.http,jdk.unsupported `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --output $runtimeDir

          Write-Host "Java runtime bundled successfully at $runtimeDir"

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          # Verify runtime, EXE, and shadow JAR exist before copying
          if (!(Test-Path "desktop\build\java-runtime")) {
            throw "ERROR: Bundled runtime not found at desktop\build\java-runtime"
          }
          if (!(Test-Path "desktop\build\launch4j\rphone-v3-desktop.exe")) {
            throw "ERROR: EXE not found at desktop\build\launch4j\rphone-v3-desktop.exe"
          }
          if (!(Test-Path "desktop\build\libs\desktop-all.jar")) {
            throw "ERROR: Shadow JAR not found at desktop\build\libs\desktop-all.jar"
          }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          # Copy EXE to root
          Copy-Item -Force desktop\build\launch4j\rphone-v3-desktop.exe out\rphone-v3-desktop.exe
          # Copy JAR to root (same directory as EXE)
          Copy-Item -Force desktop\build\libs\desktop-all.jar out\desktop-all.jar
          # Copy JRE to root
          Copy-Item -Recurse -Force desktop\build\java-runtime out\jre
          Write-Host "Artifact prepared: EXE + JAR + bundled Java runtime"

      - name: Create Windows zip package
        shell: pwsh
        run: |
          $zipPath = "out\rphone-v3-windows-package.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          # Include EXE, JAR, and JRE at root level of zip
          Compress-Archive -Path out\rphone-v3-desktop.exe, out\desktop-all.jar, out\jre -DestinationPath $zipPath

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: rphone-v3-windows-package
          path: out\rphone-v3-windows-package.zip
          if-no-files-found: error
